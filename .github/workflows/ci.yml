name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 現行 LTS(.node-version で一元管理)
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unused code (knip)
        run: npm run knip
      - name: Unit tests
        run: npm test
      - name: E2E (real pi, mock model + mock Decisions API)
        run: npm run test:e2e
