name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 26 = active LTS, 24/22 = maintenance (pi requires >=22.19)
        node: [26, 24, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unused code (knip)
        run: npm run knip
      - name: Unit tests
        run: npm test
      - name: E2E (real pi, mock model + mock Decisions API)
        run: npm run test:e2e
